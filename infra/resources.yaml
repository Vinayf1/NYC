AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NYC taxi pipeline - long-lived resources (stack 1 of 2). The data bucket holds raw/, curated/,
  quarantine/, summary/, manifests/, athena-results/ and artifacts/ (Lambda code and layer zips).
  Deployed first so the code can be uploaded before the pipeline stack (stack 2) is created.

Parameters:
  Owner:
    Type: String
    Description: Short owner name (lowercase letters and digits). Used in resource names.
    AllowedPattern: "^[a-z0-9]{2,20}$"
    ConstraintDescription: 2-20 lowercase letters or digits.

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    # No DeletionPolicy: Retain on purpose. The exercise requires a full teardown.
    # In production, add DeletionPolicy/UpdateReplacePolicy: Retain, versioning and access logging.
    Properties:
      BucketName: !Sub "taxi-pipeline-${Owner}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Emit events to EventBridge; the pipeline stack's rule picks up new trip files.
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts         # old code/layer zips are only needed for recent deploys
            Status: Enabled
            Prefix: artifacts/
            ExpirationInDays: 30

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
Outputs:
  DataBucketName:
    Description: Name of the S3 data bucket used by the taxi pipeline.
    Value: !Ref DataBucket


